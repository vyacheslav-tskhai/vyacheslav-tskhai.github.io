---
layout: default
title: "Блог — Вячеслав Цхай"
description: "Исследования, разборы и заметки о маркетинге, продукте, аналитике и росте."
---


<!-- =====================================================
     СТРАНИЦА БЛОГА

     Использует общий шаблон default.html:
     - header
     - SEO
     - стили
     - footer

     Здесь находится только содержимое страницы.
===================================================== -->


<section class="divider">


  <!-- Основная коробка страницы:

       ограничивает ширину контента,
       ставит его по центру,
       как и остальные страницы сайта -->
  <div class="container">



    <!-- Верхний блок страницы:

         содержит название раздела
         и короткое описание -->
    <div class="section-header">


      <!-- Главный заголовок страницы -->
      <h1>
        Блог
      </h1>



      <!-- Краткое описание раздела -->
      <p class="section-description">
        Заметки
      </p>


    </div>





    <!-- Сетка карточек статей:

         сюда Jekyll будет добавлять
         все опубликованные статьи -->
    <div class="blog-grid">





      <!-- Цикл Jekyll:

           берёт все статьи из папки _posts

           и повторяет этот блок
           для каждой статьи -->

      {% for post in site.posts %}





      <!-- Одна карточка статьи -->

      <article class="post-card">





        <!-- Название статьи:

             берётся из title
             внутри файла статьи -->

        <h2>

          <a href="{{ post.url }}">

            {{ post.title }}

          </a>

        </h2>







        <!-- Дата публикации:

             берётся из даты создания файла статьи -->

        <div class="meta">

          {{ post.date | date: "%d.%m.%Y" }}

        </div>







        <!-- Краткое содержание статьи:

             берётся автоматически
             из начала текста статьи -->

        <p class="excerpt">

          {{ post.excerpt }}

        </p>





      </article>





      <!-- Конец одной карточки -->

      {% endfor %}




      <!-- После завершения цикла:
           Jekyll заканчивает выводить статьи -->



    </div>


  </div>


</section>


<!-- =====================================================
     КОНЕЦ СТРАНИЦЫ БЛОГА
===================================================== -->
