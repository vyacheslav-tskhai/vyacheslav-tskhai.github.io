---
layout: default
title: Blog
---

<h1>Блог</h1>

<div class="blog-grid">

  {% for post in site.posts %}

    <article class="post-card">

      <h2>
        <a href="{{ post.url }}">
          {{ post.title }}
        </a>
      </h2>

      <div class="meta">
        {{ post.date | date: "%Y-%m-%d" }}
      </div>

      <p class="excerpt">
        {{ post.excerpt }}
      </p>

    </article>

  {% endfor %}

</div>
