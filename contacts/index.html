<script>
document.getElementById("auditForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const button=this.querySelector("button");
    button.disabled=true;
    button.textContent="Отправка...";
    const name=name=document.getElementById("name").value.trim();
    const contact=document.getElementById("contact").value.trim();
    const message=document.getElementById("message").value.trim();
    try{
        const response=await fetch("https://vyacheslav-form.slaik96.workers.dev",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name,contact,message})
        });
        const result=await response.json();
        if(result.success){window.location.href="/thanks.html";}
        else{alert(result.error||"Ошибка отправки");}
    }catch(err){
        console.error(err);
        alert("Ошибка соединения с сервером.");
    }
    button.disabled=false;
    button.textContent="Отправить заявку";
});
</script>
