<!-- ================= ОСНОВА HTML-ДОКУМЕНТА ================= -->
<!DOCTYPE html>
<!-- Язык сайта: русский -->
<html lang="ru">


<!-- HEAD:
     служебная информация страницы:
     SEO, настройки браузера и подключение ресурсов -->
<head>

  <!-- Кодировка страницы -->
  <meta charset="UTF-8">


  <!-- Адаптация под мобильные устройства -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- Название страницы:
       берётся из front matter страницы -->
  <title>{{ page.title }}</title>


  <!-- Описание страницы для поисковиков -->
  <meta 
    name="description" 
    content="{{ page.description }}"
  >


  <!-- Canonical:
       показывает поисковику основную версию страницы -->
  <link
    rel="canonical"
    href="https://vyacheslavtskhai.ru{{ page.url }}"
  >

  
<!-- Open Graph:
     отвечает за отображение ссылки
     в Telegram, VK, LinkedIn и других сервисах -->


<!-- Заголовок страницы -->
<meta 
  property="og:title"
  content="{{ page.title }}"
>

<!-- Описание страницы -->
<meta
  property="og:description"
  content="{{ page.description }}"
>

<!-- URL страницы -->
<meta
  property="og:url"
  content="https://vyacheslavtskhai.ru{{ page.url }}"
>

<!-- Тип страницы:
     website — обычная страница сайта -->
<meta
  property="og:type"
  content="website"
>

<!-- Картинка для карточки ссылки -->
<meta
  property="og:image"
  content="https://vyacheslavtskhai.ru/images/preview.jpg"
>



  <!-- Иконка сайта -->
  <link 
    rel="icon"
    type="image/png"
    href="/images/favicon.png"
  >


  <!-- Шрифт сайта:
       подключает Inter из Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- Основной файл стилей -->
  <link rel="stylesheet" href="/style.css">


</head>









  
  
<body>
  <!-- HEADER:
       подключает общую шапку сайта
       из файла _includes/header.html -->
  {% include header.html %}


  <!-- Основной контент страницы:
       сюда Jekyll вставляет содержимое
       конкретной страницы (index, audit, contacts и т.д.) -->
  <main class="content">
    {{ content }}
  </main>


  
  <!-- FOOTER:
       подключает общий подвал сайта
       из файла _includes/footer.html -->
  {% include footer.html %}
