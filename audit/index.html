<section style="padding:60px 0 80px;">
  <div class="container" style="max-width:700px;">

    <div style="text-align:center;margin-bottom:50px;">

      <div style="font-size:4rem;margin-bottom:20px;">📊</div>

      <h1 style="margin-bottom:16px;">
        Аудит
      </h1>

      <p style="font-size:1.125rem;color:#6b7280;line-height:1.7;margin-bottom:32px;">
        Страница находится в разработке.
        Если вы хотите обсудить аудит сайта или маркетинга, заполните форму ниже.
      </p>

    </div>

    <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:16px;padding:40px;">

      <div style="text-align:center;margin-bottom:30px;">
        <h2 style="margin-bottom:10px;">
          Оставить заявку
        </h2>

        <p style="color:#6b7280;">
          Я свяжусь с вами в ближайшее время.
        </p>
      </div>

      <form id="auditForm">

        <div style="margin-bottom:20px;">
          <label for="name">Ваше имя</label>

          <input
            id="name"
            name="name"
            type="text"
            required
            placeholder="Как к вам обращаться?"
            style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="contact">Как с вами связаться</label>

          <input
            id="contact"
            name="contact"
            type="text"
            required
            placeholder="Telegram, Email или телефон"
            style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="message">Сообщение</label>

          <textarea
            id="message"
            name="message"
            rows="5"
            required
            placeholder="Коротко опишите задачу"
            style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;resize:vertical;"></textarea>
        </div>

        <button
          type="submit"
          class="btn btn--primary"
          style="width:100%;">
          Отправить заявку
        </button>

      </form>

    </div>

  </div>
</section>

<script>
document.getElementById("auditForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const button = this.querySelector("button");
    button.disabled = true;
    button.textContent = "Отправка...";

    const name = document.getElementById("name").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const message = document.getElementById("message").value.trim();

    try {
        const response = await fetch("https://vyacheslav-form.slaik96.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, contact, message })
        });

        const result = await response.json();

        if (result.success) {
            window.location.href = "/thanks.html";
        } else {
            alert(result.error || "Ошибка отправки");
        }

    } catch (err) {
        console.error(err);
        alert("Ошибка соединения с сервером.");
    }

    button.disabled = false;
    button.textContent = "Отправить заявку";
});
</script>
