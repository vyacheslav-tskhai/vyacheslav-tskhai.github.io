<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аудит — Вячеслав Цхай</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header style="padding:20px;border-bottom:1px solid #e5e7eb;">
  <a href="/">Вячеслав Цхай</a>
</header>

<main style="max-width:700px;margin:60px auto;padding:20px;">
  <h1>Аудит</h1>
  <p>Раздел находится в разработке.</p>

  <form id="auditForm">
    <p><label>Имя<br><input id="name" required></label></p>
    <p><label>Телефон или Email<br><input id="contact" required></label></p>
    <p><label>Сообщение<br><textarea id="message" rows="5" required></textarea></label></p>
    <button type="submit">Отправить заявку</button>
  </form>
</main>

<footer style="padding:20px;border-top:1px solid #e5e7eb;text-align:center;">
© 2026 Вячеслав Цхай
</footer>

<script>
document.getElementById("auditForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const button = this.querySelector("button");
    button.disabled = true;
    button.textContent = "Отправка...";

    try{
        const response = await fetch("https://vyacheslav-form.slaik96.workers.dev",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                name:document.getElementById("name").value.trim(),
                contact:document.getElementById("contact").value.trim(),
                message:document.getElementById("message").value.trim()
            })
        });

        const result = await response.json();

        if(result.success){
            window.location.href="/thanks.html";
        }else{
            alert(result.error || "Ошибка отправки");
        }

    }catch(err){
        alert("Ошибка соединения с сервером.");
    }

    button.disabled = false;
    button.textContent = "Отправить заявку";
});
</script>

</body>
</html>
